[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-control-plugin"
version = "0.1.0"
description = "Desktop control plugin for dsh: capture, pointer, keyboard, accessibility-tree semantic actions, and safety guards."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dsh", "dsh-plugin", "plugin", "desktop", "automation", "accessibility", "uia", "screenshot", "input-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]
dependencies = [
    "Pillow>=9.2",
]

[project.urls]
Homepage = "https://github.com/JohnXu22786/computer-control"
Repository = "https://github.com/JohnXu22786/computer-control"
Issues = "https://github.com/JohnXu22786/computer-control/issues"

[project.optional-dependencies]
uia = ["comtypes>=1.2"]
mss = ["mss>=9"]
full = ["comtypes>=1.2", "mss>=9", "keyboard>=0.13"]
dev = ["pytest"]

[project.scripts]
computer-control = "computer_control.cli:main"

[tool.setuptools]
packages = ["computer_control", "computer_control.drivers", "computer_control.a11y"]
